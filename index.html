<!doctype html>
<!-- ไฟล์นี้สร้างอัตโนมัติจาก index.html + app.css + core.js + app.js ด้วย scripts/build.js (เวอร์ชัน 1.5.3) อย่าแก้ตรงนี้ แก้ที่ต้นทางแล้วรัน npm run build -->
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="เวรหอนอน">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>ตารางเวรหอนอน หอฟ้าทะลายโจร</title>
<style>
/* ธีม 1.2.0: เขียวเข้มแบบแอปการเงิน (Design 1 สว่าง) · หัวการ์ดเขียวเข้มมีลายตาราง · แผ่นเนื้อหาขาวมุมโค้ง · เมนูล่างบนมือถือ
   สีครูชาย/หญิง (ฟ้า/ชมพู) คงเดิมตามที่ผู้ใช้เลือก */
:root {
  color-scheme: light;
  --hero-grad: linear-gradient(180deg, #000000 0%, #0B1F19 28%, #17503D 62%, #2F8A62 88%, #4FA97F 100%); /* ดำด้านบน (ต่อกับแถบเวลา iPhone) ไล่ลงเขียวเข้ม เขียวอ่อน */
  --sheet: #F3F6F4; --surface: #FFFFFF; --field: #ffffff;
  --ink: #10261F; --muted: #5B7268;
  --line: #CFDCD5; --line-soft: #E3EAE6;
  --brand: #0F2A22; --brand-ink: #ffffff; --accent: #2E8B62; --accent-2: #5CC08E; --mint: #9FF0C4;
  --ok: #1B5F21; --ok-bg: #E8F4E8; --warn: #8A5200; --warn-bg: #FFF3E1; --err: #B71D1D; --err-bg: #FFEBEE; --na-bg: #EEF2F0;
  --m: #0D47A1; --m-bg: #E2F2FC; --f: #C2185B; --f-bg: #FDE5EC;
  --dg: #2F5D50; --dg-bg: #E2EEE8;
  --radius: 22px;
  --shadow: 0 4px 18px rgba(15, 42, 34, .07);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--sheet); }
body { margin: 0; min-height: 100vh; background: var(--sheet); color: var(--ink); font-family: "Noto Sans Thai", "Sarabun", system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.5; font-size: 16px; }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; }
button, input, select, textarea { font: inherit; color: inherit; }

/* หัวแอป (การ์ดเขียวเข้ม) */
.top { background: linear-gradient(rgba(255, 255, 255, .045) 1px, transparent 1px) 0 0 / 22px 22px, linear-gradient(90deg, rgba(255, 255, 255, .045) 1px, transparent 1px) 0 0 / 22px 22px, var(--hero-grad); color: #fff; padding: max(16px, env(safe-area-inset-top)) 16px 44px; }
.top-in { max-width: 1100px; margin: 0 auto; }
.hero-top { display: flex; align-items: center; gap: 12px; }
.logo { width: 46px; height: 46px; flex: none; display: grid; place-items: center; font-size: 1.4rem; border-radius: 999px; background: rgba(255, 255, 255, .1); border: 2px solid rgba(255, 255, 255, .55); }
.hello { flex: 1; min-width: 0; }
.hello h1 { font-size: 1.2rem; }
.hello p { margin: 1px 0 0; font-size: .75rem; color: #A9C9BA; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bell { position: relative; flex: none; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .25); background: rgba(255, 255, 255, .12); color: #fff; cursor: pointer; }
.bell:hover { background: rgba(255, 255, 255, .2); }
.bell-n { position: absolute; top: -3px; right: -3px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 999px; background: #FF6B6B; color: #fff; font-size: .68rem; font-weight: 700; line-height: 19px; text-align: center; box-shadow: 0 0 0 2px #123A2E; }
.hero { padding-bottom: 2px; }
.hero-k { font-size: .8rem; color: #A9C9BA; }
.hero-top + .hero-k { margin-top: 18px; }
.hero-big { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin: 0 0 8px; font-variant-numeric: tabular-nums; }
.hero-big b { font-size: 2.9rem; font-weight: 700; line-height: 1.05; letter-spacing: -.5px; }
.hero-big .u { font-size: 1.25rem; color: #DDEFE6; font-weight: 600; }
.hero-t { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; padding: 8px 14px; border-radius: 16px; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .12); width: fit-content; max-width: 100%; }
.hero-name { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
.hero-name .dot { width: 10px; height: 10px; border-radius: 999px; flex: none; box-shadow: 0 0 0 2px rgba(255, 255, 255, .35); }
.hero-none { color: #DDEFE6; font-weight: 600; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .78rem; font-weight: 700; background: rgba(159, 240, 196, .16); color: var(--mint); }
.pill-err { background: rgba(255, 138, 138, .2); color: #FFC2C2; } .pill-warn { background: rgba(255, 196, 102, .2); color: #FFDCA3; }

/* แท็บ: จอใหญ่อยู่ในหัวแอป · มือถือเป็นเมนูล่าง (ดู @media) */
.tabs { display: flex; gap: 6px; max-width: 1100px; margin: 16px auto 0; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { display: inline-flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, .08); color: #DDEFE6; border: 1px solid rgba(255, 255, 255, .16); padding: 7px 16px 7px 12px; cursor: pointer; white-space: nowrap; border-radius: 999px; font-size: .92rem; }
.tab:hover { background: rgba(255, 255, 255, .16); }
.tab[aria-selected="true"] { background: var(--mint); border-color: var(--mint); color: var(--brand); font-weight: 700; }
.tab .short { display: none; }

main { position: relative; max-width: 1100px; min-height: 60vh; margin: -28px auto 0; padding: 20px 16px 16px; background: var(--sheet); border-radius: 28px 28px 0 0; }
.card, .bar, dialog { border: 1px solid var(--line-soft); background: var(--surface); }
.card { border-radius: var(--radius); padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); }
.card h2 { font-size: 1.05rem; margin-bottom: 10px; }
.muted { color: var(--muted); font-size: .9rem; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.row > * { min-width: 0; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); }
input[type=date], input[type=text], input[type=number], input[type=password], select, textarea { background: var(--field); border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 12px; min-height: 40px; color: var(--ink); }
button.btn { background: var(--field); border: 1.5px solid var(--line); border-radius: 999px; padding: 8px 16px; min-height: 40px; cursor: pointer; }
button.btn:hover { border-color: var(--accent); }
button.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: var(--accent); color: #fff; font-weight: 700; }
button.primary:hover { filter: brightness(1.05); }
button.danger { color: var(--err); }
button:focus-visible, input:focus-visible, select:focus-visible, .cell:focus-visible, li[data-action]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ปุ่มไอคอนกลมของหน้าตารางเวร */
.quick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; max-width: 520px; margin: 0 auto 10px; }
.qa { display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: 0; padding: 4px 0; cursor: pointer; font-size: .8rem; color: var(--ink); text-align: center; }
.qi { width: 56px; height: 56px; display: grid; place-items: center; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--accent); box-shadow: var(--shadow); transition: .15s; }
.qa:hover .qi { border-color: var(--accent); background: #E8F5EE; }
.qa-main .qi { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; color: #fff; }
.hint-line { text-align: center; margin: 0 0 14px; font-size: .8rem; }
/* สถานะเดือน: ร่าง / ประกาศแล้ว / ปิดเดือน */
.mstat { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; max-width: 620px; margin: 0 auto 12px; padding: 8px 10px 8px 16px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line-soft); font-size: .85rem; }
.mstat.on { background: #FFF6E5; border-color: #F1D3A1; } .mstat.closed { background: #E8F4EE; border-color: #B9DCC8; }
/* ป้ายเล็กในช่องวัน: เวรเดี่ยว / แก้หลังประกาศ */
.tagrow { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; }
.tagx { display: inline-block; padding: 0 6px; border-radius: 999px; font-size: .68rem; font-weight: 700; background: #FFF1D6; color: #8A5200; }
.tagx.chg { background: #E7EEF9; color: #2B4C8C; }
.tagx.hol { background: var(--f-bg); color: var(--f); }
.cell.hol .num { color: var(--f); font-weight: 700; }
/* วันไม่ว่าง / คืนกลับจากราชการ (แท็บครู) */
/* ส่งตารางไป LINE */
dialog { max-height: 92vh; overflow-y: auto; }
.share-prev { display: block; width: 100%; height: auto; margin: 10px 0 12px; border-radius: 12px; border: 1px solid var(--line-soft); }
#shareNote { width: 100%; resize: vertical; line-height: 1.5; font-size: .9rem; }
.share-text { margin-top: 10px; }
.share-text summary { cursor: pointer; color: var(--muted); font-size: .88rem; }
.share-text pre { white-space: pre-wrap; font: inherit; font-size: .82rem; max-height: 220px; overflow: auto; background: var(--sheet); padding: 10px 12px; border-radius: 12px; margin: 8px 0 0; -webkit-user-select: text; user-select: text; }
h4.dhead { font-size: .82rem; color: var(--muted); margin: 8px 0 0; }
.tag.tag-travel { background: #FFF1D6; color: #8A5200; }
.tag.tag-travel button { color: #8A5200; }
/* เทอม / วันหยุด / จุดตั้งต้นเดิม (แท็บตั้งค่า) */
.term-row { border-top: 1px solid var(--line-soft); padding: 12px 0; }
.term-row:first-of-type { border-top: 0; }
details.card.legacy > summary { cursor: pointer; list-style: none; }
details.card.legacy > summary::-webkit-details-marker { display: none; }
details.card.legacy > summary h2 { display: inline; }
details.card.legacy:not([open]) > summary h2 { color: var(--muted); }
.hol-table td { padding: 6px 8px; }
.fair-cards { display: none; }
.hol-table td:first-child, .hol-table td:last-child { white-space: nowrap; }
.hol-table tr.off td { opacity: .55; text-decoration: line-through; }
.hol-table tr.off td:last-child { text-decoration: none; opacity: 1; }
#risk, #issues { scroll-margin-top: 80px; }

/* การ์ดเด่น (เลื่อนซ้าย-ขวาได้) */
.feat { margin-bottom: 18px; }
.feat-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; border-radius: 22px; }
.feat-track::-webkit-scrollbar { display: none; }
.feat-card { position: relative; flex: 0 0 100%; scroll-snap-align: start; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 150px; padding: 16px 12px 16px 20px; border-radius: 22px; color: #fff; overflow: hidden;
  background: radial-gradient(120% 140% at 85% 30%, rgba(255, 255, 255, .22) 0%, rgba(255, 255, 255, 0) 55%), linear-gradient(120deg, #1F6B50 0%, #3FA37A 55%, #7DD3A8 100%); }
.feat-warn { background: radial-gradient(120% 140% at 85% 30%, rgba(255, 255, 255, .22) 0%, rgba(255, 255, 255, 0) 55%), linear-gradient(120deg, #1F5A44 0%, #6E8A3A 55%, #D9B45A 100%); }
.feat-err { background: radial-gradient(120% 140% at 85% 30%, rgba(255, 255, 255, .2) 0%, rgba(255, 255, 255, 0) 55%), linear-gradient(120deg, #4A1F1F 0%, #9C3A32 55%, #E0846A 100%); }
.feat-txt { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; z-index: 1; }
.feat-brand { font-size: .72rem; opacity: .9; font-weight: 600; }
.feat-txt strong { font-size: 1.3rem; font-weight: 800; line-height: 1.2; text-shadow: 0 1px 8px rgba(0, 0, 0, .12); }
.feat-sub { font-size: .82rem; opacity: .92; }
.feat-btn { margin-top: 8px; padding: 4px 14px; border-radius: 999px; border: 1.5px solid rgba(255, 255, 255, .85); background: rgba(255, 255, 255, .08); color: #fff; font-size: .78rem; font-weight: 700; cursor: pointer; }
.feat-btn:hover { background: rgba(255, 255, 255, .2); }
.feat-art { flex: none; width: 140px; height: 110px; filter: drop-shadow(0 8px 14px rgba(0, 0, 0, .18)); }
.dots { display: flex; justify-content: center; gap: 6px; margin-top: 10px; }
.dot-btn { width: 8px; height: 8px; padding: 0; border-radius: 999px; border: 0; background: #C9D6CF; cursor: pointer; transition: .2s; }
.dot-btn[aria-current="true"] { width: 22px; background: var(--accent); }

/* แถวการ์ดเวร 7 คืนข้างหน้า */
h2.sec { font-size: 1rem; margin: 0 2px 10px; }
.wk-track { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x proximity; padding: 2px 2px 14px; margin-bottom: 6px; scrollbar-width: thin; }
.wkc { flex: 0 0 150px; scroll-snap-align: start; display: flex; flex-direction: column; padding: 0; overflow: hidden; border-radius: 20px; border: 1px solid var(--line-soft); background: var(--surface); box-shadow: var(--shadow); text-align: left; cursor: pointer; font: inherit; color: inherit; }
.wkc:hover { border-color: var(--accent); }
.wkc-top { position: relative; display: flex; align-items: center; gap: 10px; height: 76px; padding: 10px 12px; color: #fff; background: linear-gradient(135deg, #2E8B62, #7DD3A8); }
.wkc-M .wkc-top { background: linear-gradient(135deg, #1E4E8C, #43A5F4 70%, #9AD4FB); }
.wkc-F .wkc-top { background: linear-gradient(135deg, #A3134D, #ED417A 65%, #F8A9C4); }
.wkc.off .wkc-top { background: linear-gradient(135deg, #8FA39A, #C9D6CF); }
.wkc-top b { font-size: 2rem; line-height: 1; }
.wkc-top span { font-size: .72rem; line-height: 1.3; opacity: .95; }
.wkc-top em { position: absolute; top: 8px; right: 8px; font-style: normal; font-size: .66rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: rgba(255, 255, 255, .9); color: var(--brand); }
.wkc-bot { display: flex; flex-direction: column; gap: 4px; padding: 10px 10px 12px; }
.wkc-tags { display: flex; align-items: center; gap: 6px; font-size: .72rem; }
.wkc-dg { padding: 0 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.wkc .chip { font-size: .8rem; }
.wkc.off { cursor: default; opacity: .8; }

.badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .78rem; font-weight: 600; }
.b-ok { background: var(--ok-bg); color: var(--ok); } .b-warn { background: var(--warn-bg); color: var(--warn); }
.b-err { background: var(--err-bg); color: var(--err); } .b-na { background: var(--na-bg); color: var(--muted); }
.gt { display: inline-block; padding: 0 8px; border-radius: 999px; font-size: .75rem; font-weight: 700; }
.gt-M { background: var(--m-bg); color: var(--m); } .gt-F { background: var(--f-bg); color: var(--f); }

.bar { position: sticky; top: max(8px, env(safe-area-inset-top)); z-index: 5; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: center; border-radius: 999px; padding: 6px 12px; margin: 0 auto 16px; max-width: 520px; box-shadow: 0 6px 22px rgba(15, 42, 34, .12); }
.bar .month { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 1.1rem; }
.bar .month { flex: 1; justify-content: space-between; }
.bar .month button { min-width: 40px; padding: 4px 12px; color: var(--accent); font-weight: 700; }
.dirty { color: var(--warn); font-weight: 600; }
.statusline { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; justify-content: flex-end; margin: -6px 0 12px; font-size: .82rem; }
button.btn.sm { min-height: 28px; padding: 1px 12px; font-size: .8rem; }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; font-size: .9rem; }
.cmp > div { border: 1.5px solid var(--line-soft); border-radius: 14px; padding: 8px 12px; background: var(--field); }
.saved { color: var(--ok); font-weight: 600; }

.banner { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding: 12px 18px; border-radius: 18px; margin-bottom: 16px; border: 1px solid var(--line-soft); background: var(--surface); }
.banner.err { background: var(--err-bg); border-color: #F2B8B8; } .banner.warn { background: var(--warn-bg); border-color: #F1D3A1; }
.banner.ok { background: linear-gradient(120deg, #1F6B50 0%, #3FA37A 60%, #7DD3A8 100%); border: 0; color: #fff; padding: 16px 20px; box-shadow: 0 8px 24px rgba(31, 107, 80, .25); }
.banner.ok .muted { color: rgba(255, 255, 255, .88); }

/* ปฏิทิน */
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.dow { text-align: center; font-weight: 700; font-size: .85rem; color: var(--muted); padding: 4px 0; }
.dow.we { color: var(--f); }
.dow .short { display: none; }
.cell { position: relative; min-height: 108px; background: var(--field); border: 1.5px solid var(--line); border-radius: 16px; padding: 6px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 3px; font: inherit; color: inherit; }
.cell:hover { border-color: var(--accent); }
.cell .dn { font-size: .8rem; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 4px; }
.cell .dg { font-size: .7rem; background: var(--dg-bg); color: var(--dg); border-radius: 999px; padding: 0 7px; white-space: nowrap; font-weight: 600; }
.cell.blank { border: 0; background: transparent; cursor: default; }
.cell.off { background: transparent; border-style: dashed; cursor: default; opacity: .65; }
.cell.sat .num, .cell.sun .num { color: var(--f); font-weight: 700; }
.cell.has-err { border-color: var(--err); box-shadow: inset 0 0 0 1px var(--err); background: var(--err-bg); }
.cell.has-warn { border-color: var(--warn); box-shadow: inset 0 0 0 1px var(--warn); background: var(--warn-bg); }
.cell .body { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }
.cell .chips { display: flex; flex-direction: column; gap: 3px; width: 100%; }
.chip { display: block; border-radius: 999px; padding: 1px 10px; font-size: .88rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pend { font-size: .82rem; font-weight: 700; color: var(--warn); }
.wk { display: none; }

.issues { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.issues li { display: flex; gap: 8px; align-items: baseline; padding: 8px 12px; border-radius: 12px; border: 1.5px solid var(--line-soft); background: var(--field); cursor: pointer; }
.issues li.error { background: var(--err-bg); border-color: var(--err); } .issues li.warn { background: var(--warn-bg); border-color: var(--warn); }
.issues .rule { font-weight: 700; flex: none; min-width: 2.2em; }
.chips-inline { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 4px 2px 12px; border-radius: 999px; background: var(--dg-bg); color: var(--dg); font-size: .88rem; }
.tag button { border: 0; background: transparent; cursor: pointer; padding: 0 6px; font-size: 1rem; color: var(--dg); }
.person { border-top: 1.5px solid var(--line-soft); padding: 12px 0; }
.person:first-of-type { border-top: 0; }
.person h3 { font-size: 1rem; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1.5px solid var(--line-soft); vertical-align: top; }
th { font-size: .82rem; color: var(--muted); font-weight: 700; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tfoot td { font-weight: 700; border-top: 2px solid var(--line); border-bottom: 0; }
.tablewrap { overflow-x: auto; }

dialog { border-radius: var(--radius); padding: 18px; max-width: 460px; width: calc(100% - 24px); color: var(--ink); box-shadow: 0 20px 50px rgba(11, 31, 25, .3); }
dialog::backdrop { background: rgba(11, 31, 25, .5); }
.pick { display: flex; flex-direction: column; gap: 4px; margin: 10px 0; max-height: 46vh; overflow-y: auto; }
.pick label { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border: 1.5px solid var(--line); border-radius: 14px; cursor: pointer; flex-wrap: wrap; background: var(--field); }
.pick label.dim { opacity: .75; }
.pick input { width: 20px; height: 20px; }

<script>
(function (root, factory) {

  const SCHEMA = 4;
  const DAY_MS = 86400000;
  const THAI_DOW = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];

  const SHORT_MONTH = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  const GENDER_LABEL = { M: 'ชาย', F: 'หญิง' };

  // ---------- วันที่ (ISO yyyy-mm-dd, คำนวณแบบ UTC) ----------

  const diffDays = (a, b) => Math.round((parse(a) - parse(b)) / DAY_MS);

  const isIso = (s) => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
  const monthOf = (iso) => iso.slice(0, 7);
  function range(start, end) {
    const out = [];
    if (!isIso(start) || !isIso(end) || start > end) return out;
    for (let d = start; d <= end; d = addDays(d, 1)) out.push(d);

  function monthRange(ym) {
    const [y, m] = ym.split('-').map(Number);
    return { start: ym + '-01', end: fmt(Date.UTC(y, m, 0)) };
  }
  function addMonth(ym, n) {
    const [y, m] = ym.split('-').map(Number);
    const t = y * 12 + (m - 1) + n;

  // ---------- ข้อมูลตั้งต้น ----------
  function defaultState() {
    return {
      version: 4,

      dormName: 'หอฟ้าทะลายโจร',
      // รายชื่อครู: หัวหน้าหอกรอกเองที่แท็บครู (ไม่ใส่ชื่อในโค้ด เพราะโค้ดเผยแพร่ใน repo สาธารณะ)
      // { name: ชื่อเล่น (ใช้อ้างอิงในตาราง), gender: 'M'|'F', prefix: 'นาย'|'นาง'|'นางสาว'|'', fullName: ชื่อ-สกุลจริง, active: ยังอยู่เวร }
      staff: [],
      payer: { prefix: '', fullName: '' }, // ผู้จ่ายเงิน (หัวหน้าหอ) ใช้ลงชื่อในใบรับเงิน
      // เวรกลางวัน: หมุนกลุ่ม 1–6 ทุกวัน (กลุ่ม 3 ไม่มีครูหอ)

      // (เมื่อตารางกลางวันตั้งต้นใหม่ ให้เพิ่มจุดใหม่ เดือนเก่าจะไม่เปลี่ยน)
      dayGroups: {
        anchors: [{ date: '2026-10-28', group: 4 }],
        of: {}                       // { ชื่อเล่น: กลุ่ม 1–6 }
      },
      firstNightDate: '2026-11-02',  // คืนแรกที่มีเวรนอน
      firstNightGender: 'F',         // คืนแรกเป็นชุดหญิง
      noDuty: [],                    // [{from,to,note}] ช่วงที่ไม่มีเวร เช่น ปิดเทอม
      unavailable: {},               // { ชื่อ: [วันที่] }
      schedule: {},                  // { วันที่เริ่มเวร: [ชื่อ, ชื่อ] }
      locked: {},                    // { วันที่: true } ตัวสร้างอัตโนมัติไม่แตะ
      single: {},                    // { วันที่: true } เวรเดี่ยว: นักเรียนไม่ถึงเกณฑ์ ครูอยู่คนเดียว ได้ค่าตอบแทน 2 ส่วน (ตัวสร้างไม่แตะ)
      months: {},
      terms: [],                     // [{name, from, to, dayStart, dayGroup}] เทอม: คืนเวรแรก-คืนเวรสุดท้าย และเวรกลางวันเริ่มวัน dayStart เป็นกลุ่ม dayGroup (ปิดเทอม = ไม่มีเวร)
      holidays: {},                  // { วันที่: 'ชื่อวันหยุด' | null } เพิ่มวันหยุด (เช่น วันพระ วันหยุดชดเชย) หรือ null = ยกเลิกวันหยุดตายตัววันนั้น
      travel: {},                    // { ชื่อ: [วันที่] } คืนกลับจากเดินทางราชการ: ตัวสร้างเลี่ยงก่อน เลี่ยงไม่ได้จัดได้ + เตือน                    // { 'yyyy-mm': { announcedAt, announced: {วันที่: [ชื่อ]}, changes: [{at, date, from, to, reason}], closedAt } }
      payroll: {}                    // { 'yyyy-mm': ยอดการเงิน }
    };
  }

  // ครูที่ยังอยู่เวร (ตัวสร้างใช้เฉพาะกลุ่มนี้ ครูที่ย้ายออกยังอยู่ในประวัติและค่าตอบแทนเดือนเก่า)
  const activeStaff = (state) => state.staff.filter((s) => s.active !== false);
  const genderOf = (state, name) => { const s = state.staff.find((x) => x.name === name); return s ? s.gender : null; };
  function pairGender(state, names) {
    if (!names || names.length !== 2 || names[0] === names[1]) return null;
    const a = genderOf(state, names[0]), b = genderOf(state, names[1]);

  // เวรเดี่ยวที่ถูกต้อง = ตั้งเป็นเวรเดี่ยว และมีครู 1 คนพอดี
  const isSingle = (state, d) => !!(state.single || {})[d] && (state.schedule[d] || []).length === 1;
  // ชุดของคืน: คู่เพศเดียวกัน หรือเพศของครูเวรเดี่ยว (ใช้สลับชุด B2/B3) ใช้ null ถ้ายังไม่ใช่ชุดที่สมบูรณ์
  const nightGender = (state, d) => (isSingle(state, d) ? genderOf(state, state.schedule[d][0]) : pairGender(state, state.schedule[d]));
  // ---------- เทอม ----------
  const sortedTerms = (state) => (state.terms || []).filter((t) => isIso(t.from) && isIso(t.to) && t.from <= t.to).slice().sort((a, b) => (a.from < b.from ? -1 : 1));
  const termOf = (state, d) => sortedTerms(state).find((t) => d >= t.from && d <= t.to) || null;
  // เทอมของเดือน: เทอมที่มีคืนใดคืนหนึ่งในเดือนนั้น (ถ้ามีหลายเทอมใช้เทอมแรก)

    const { start, end } = monthRange(ym);

      if (x.date <= date && (!best || x.date > best.date)) best = x;

    const a = best || first; // วันก่อนจุดแรก: ขยายย้อนหลังจากจุดแรก
    return (((diffDays(date, a.date) + a.group - 1) % 6) + 6) % 6 + 1;
  };
  const isSupportedVersion = (v) => v === 2 || v === 3 || v === 4;
  // แปลงข้อมูลเก่าเป็นเวอร์ชันปัจจุบัน ไม่แก้ต้นฉบับ
  // 2 → 3: anchorDate/anchorGroup ค่าเดียว → anchors หลายจุด · 3 → 4: ครูมี prefix/fullName/active และมี payer
  function migrate(obj) {
    const o = JSON.parse(JSON.stringify(obj || {}));
    const dg = o.dayGroups = o.dayGroups || {};
    if ((!Array.isArray(dg.anchors) || !dg.anchors.length) && dg.anchorDate && dg.anchorGroup) dg.anchors = [{ date: dg.anchorDate, group: Number(dg.anchorGroup) }];
    delete dg.anchorDate; delete dg.anchorGroup;
    if (Array.isArray(dg.anchors)) dg.anchors = dg.anchors.filter((a) => a && isIso(a.date) && a.group >= 1 && a.group <= 6).map((a) => ({ date: a.date, group: Number(a.group) })).sort((x, y) => (x.date < y.date ? -1 : x.date > y.date ? 1 : 0));
    if (Array.isArray(o.staff)) o.staff = o.staff.map((x) => Object.assign({ prefix: '', fullName: '' }, x, { active: x.active !== false }));
    o.payer = Object.assign({ prefix: '', fullName: '' }, o.payer);
    o.single = o.single || {}; o.months = o.months || {};
    o.terms = Array.isArray(o.terms) ? o.terms : []; o.holidays = o.holidays || {}; o.travel = o.travel || {};
    if (o.version === undefined || o.version < SCHEMA) o.version = SCHEMA;
    return o;
  }
  const dayMembers = (state, date) => state.staff.filter((s) => state.dayGroups.of[s.name] === dayGroup(state, date)).map((s) => s.name);
  // คืนเวร: ไม่ก่อน firstNightDate ไม่อยู่ในช่วงงดเวร และถ้ามีเทอม ต้องอยู่ในเทอม (ก่อนเทอมแรกใช้กติกาเดิม)
  const isDutyNight = (state, d) => {
    if (!(d >= state.firstNightDate) || (state.noDuty || []).some((r) => d >= r.from && d <= r.to)) return false;
    const terms = sortedTerms(state);
    return !terms.length || d < terms[0].from || terms.some((t) => d >= t.from && d <= t.to);
  };

  // ---------- วันหยุด ----------
  const FIXED_HOLIDAYS = { '01-01': 'วันขึ้นปีใหม่', '04-06': 'วันจักรี', '04-13': 'วันสงกรานต์', '04-14': 'วันสงกรานต์', '04-15': 'วันสงกรานต์',
    '05-04': 'วันฉัตรมงคล', '06-03': 'วันเฉลิมพระชนมพรรษาสมเด็จพระราชินี', '07-28': 'วันเฉลิมพระชนมพรรษา ร.10', '08-12': 'วันแม่แห่งชาติ',
    '10-13': 'วันนวมินทรมหาราช', '10-23': 'วันปิยมหาราช', '12-05': 'วันพ่อแห่งชาติ', '12-10': 'วันรัฐธรรมนูญ', '12-31': 'วันสิ้นปี' };
  // ชื่อวันหยุดนักขัตฤกษ์ของวันนั้น ('' = ไม่ใช่) : ที่หัวหน้าหอกรอกเองมาก่อน (null = ยกเลิกวันหยุดตายตัว) แล้วค่อยวันที่ตายตัว
  function holidayName(state, d) {
    const h = state.holidays || {};
    if (d in h) return h[d] || '';
    return FIXED_HOLIDAYS[d.slice(5)] || '';
  }
  // คืนวันหยุด (ใช้สมดุลเวรวันหยุด): คืนวันเสาร์ คืนวันอาทิตย์ และคืนวันหยุดนักขัตฤกษ์ (นับตามวันที่เริ่มเวร)
  const isHolidayNight = (state, d) => dow(d) === 6 || dow(d) === 0 || !!holidayName(state, d);
  const onTravel = (state, name, d) => ((state.travel || {})[name] || []).includes(d);
  // คืนที่มีเวรล่าสุดก่อนคืน d (กระโดดข้ามช่วงงดเวรทั้งช่วง ไม่จำกัดความยาว) ใช้ null ถ้าไม่มี
  // ข้ามทั้งช่วงงดเวร (noDuty) และช่วงปิดเทอม (ระหว่างเทอม) ไปหาคืนเวรจริงล่าสุด
  function prevDutyNight(state, d) {
    let p = addDays(d, -1);
    while (p >= state.firstNightDate) {
      const r = (state.noDuty || []).find((x) => p >= x.from && p <= x.to);
      if (r) { p = addDays(r.from, -1); continue; }
      if (isDutyNight(state, p)) return p;
      const before = sortedTerms(state).filter((t) => t.to < p).pop(); // ปิดเทอม: กระโดดไปคืนสุดท้ายของเทอมก่อนหน้า
      p = before ? before.to : addDays(p, -1);
    }
    return null;
  }

  // เหตุผลที่ครูคนหนึ่งจัดเวรคืนนี้ไม่ได้ (B4 และวันไม่ว่าง) ใช้ null ถ้าจัดได้
  function excludedReason(state, name, d, withUnavailable) {
    const grp = state.dayGroups.of[name];
    if (grp === dayGroup(state, d)) return 'เวรกลางวันกลุ่ม ' + grp + ' วันนี้';
    if (grp === dayGroup(state, addDays(d, 1))) return 'เวรกลางวันกลุ่ม ' + grp + ' เช้าวันถัดไป';
    if (withUnavailable !== false && ((state.unavailable || {})[name] || []).includes(d)) return 'แจ้งไม่ว่าง';
    return null;
  }
  const eligible = (state, d, g, withUnavailable) =>
    activeStaff(state).filter((s) => s.gender === g && !excludedReason(state, s.name, d, withUnavailable)).map((s) => s.name);

  // ---------- ตัวตรวจกติกา B1–B4 ----------
  function validate(state, from, to) {
    const issues = [];
    const add = (rule, level, date, names, msg) => issues.push({ rule, level, date, names: names || [], msg });
    const sched = state.schedule || {};
    range(from, to).forEach((d) => {
      const names = sched[d] || [];
      const duty = isDutyNight(state, d);
      if (!names.length) { if (duty) add('P', 'warn', d, [], 'รอหัวหน้าหอ: ยังไม่มีครูเวรคืนนี้'); return; }
      if (!duty) add('P', 'warn', d, names, 'คืนนี้อยู่นอกช่วงที่มีเวร');
      names.forEach((n) => { if (!genderOf(state, n)) add('B1', 'error', d, [n], 'ชื่อ "' + n + '" ไม่อยู่ในรายชื่อครู'); });
      const single = !!(state.single || {})[d];
      if (single && names.length !== 1) add('P', 'warn', d, names, 'ตั้งเป็นเวรเดี่ยว แต่มีครู ' + names.length + ' คน');
      else if (!single && names.length !== 2) add('P', 'warn', d, names, 'มีครู ' + names.length + ' คน (ต้องการ 2 คน)');
      if (new Set(names).size !== names.length) add('B1', 'error', d, names, 'มีชื่อซ้ำในคืนเดียวกัน');
      const gs = new Set(names.map((n) => genderOf(state, n)).filter(Boolean));
      if (names.length >= 2 && gs.size > 1) add('B1', 'error', d, names, 'คู่เวรต่างเพศ (ต้องชช/ญญ)');
      const pg = nightGender(state, d), pd = prevDutyNight(state, d), prev = pd && sched[pd];
      if (pg && prev) {
        const pp = nightGender(state, pd);
        if (pp && pp === pg) add(monthOf(pd) !== monthOf(d) ? 'B3' : 'B2', 'error', d, names, 'คืนก่อนหน้าเป็นชุด' + GENDER_LABEL[pg] + 'เหมือนกัน ต้องสลับชุด');
      }
      names.forEach((n) => {
        const grp = state.dayGroups.of[n];
        if (grp === dayGroup(state, d)) add('B4', 'error', d, [n], 'ครู' + n + ' เวรกลางวันกลุ่ม ' + grp + ' วันนี้ ชนเวรนอน (รวม 24 ชม.)');
        if (grp === dayGroup(state, addDays(d, 1))) add('B4', 'error', d, [n], 'ครู' + n + ' เวรกลางวันกลุ่ม ' + grp + ' เช้าวันถัดไป ต่อจากเวรนอน (รวม 24 ชม.)');
        if (((state.unavailable || {})[n] || []).includes(d)) add('U', 'error', d, [n], 'ครู' + n + ' แจ้งไม่ว่างคืนนี้');
        if (onTravel(state, n, d)) add('R', 'warn', d, [n], 'ครู' + n + ' กลับจากราชการคืนนี้ ควรได้พัก (จัดได้ถ้าจำเป็น)');
        if ((sched[addDays(d, -1)] || []).includes(n)) add('N', 'warn', d, [n], 'ครู' + n + ' ขึ้นเวรติดกัน (เมื่อคืนและคืนนี้)');
      });
    });
    return issues;
  }

  // ---------- สรุปรายเดือนและค่าตอบแทน ----------
  function monthStats(state, ym) {
    const { start, end } = monthRange(ym);
    const nightList = range(start, end).filter((d) => isDutyNight(state, d));
    const counts = {}, singles = {}, shares = {};   // คืนที่ขึ้นเวร · ในนั้นเป็นเวรเดี่ยวกี่คืน · ส่วนที่ได้ (เวรเดี่ยว = 2 ส่วน)
    state.staff.forEach((s) => { counts[s.name] = 0; singles[s.name] = 0; shares[s.name] = 0; });
    nightList.forEach((d) => {
      const one = isSingle(state, d);
      (state.schedule[d] || []).forEach((n) => { if (n in counts) { counts[n]++; shares[n] += one ? 2 : 1; if (one) singles[n]++; } });
    });
    const pending = nightList.filter((d) => (state.schedule[d] || []).length !== 2 && !isSingle(state, d));
    return { ym, start, end, nights: nightList.length, nightList, counts, singles, shares, pending };
  }

  // N = ยอดการเงิน ÷ จำนวนคืนที่มีเวรจริงในเดือน · X = N ÷ 2 · ค่าตอบแทน = X × จำนวนส่วน (เวรปกติ 1 ส่วน เวรเดี่ยว 2 ส่วน) ไม่ปัดเศษ
  function payroll(state, ym) {
    const st = monthStats(state, ym);
    const raw = (state.payroll || {})[ym];
    const amount = raw === undefined || raw === '' || raw === null || isNaN(Number(raw)) ? null : Number(raw);
    const N = amount !== null && st.nights ? amount / st.nights : null;
    const X = N === null ? null : N / 2;
    const rows = state.staff.filter((s) => s.active !== false || st.counts[s.name]).map((s) => ({ name: s.name, gender: s.gender, count: st.counts[s.name], singles: st.singles[s.name], shares: st.shares[s.name], pay: X === null ? null : X * st.shares[s.name] }));
    const total = X === null ? null : rows.reduce((a, r) => a + r.pay, 0);
    return { ym, amount, nights: st.nights, N, X, rows, total, pending: st.pending };
  }

  // ---------- ตัวสร้างตาราง ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ชุดของแต่ละคืน (B2/B3): ตรงข้ามกับคืนก่อนหน้า ถ้ายังไม่มีเลยใช้ firstNightGender
  function planGenders(state, nights) {
    const out = {};
    if (!nights.length) return out;
    const keys = Object.keys(state.schedule).filter((k) => (state.schedule[k] || []).length && isDutyNight(state, k)).sort();
    let prev = null;
    for (let i = keys.length - 1; i >= 0; i--) {
      if (keys[i] >= nights[0]) continue;
      const g = nightGender(state, keys[i]);
      if (g) { prev = g; break; }
    }
    nights.forEach((d) => {
      let g = (state.schedule[d] || []).length ? nightGender(state, d) : null;
      if (!g) g = prev ? opp(prev) : state.firstNightGender;
      out[d] = g; prev = g;
    });
    return out;
  }

  // สร้างตารางของเดือน: ถ้าเดือนนั้นมีคืนของหลายเทอม จัดทีละช่วงเทอม (ยอดสะสมเริ่มใหม่ตามเทอมของคืนนั้น)
  function generate(state, ym, opts) {
    const { start, end } = monthRange(ym);
    const all = range(start, end).filter((d) => isDutyNight(state, d)), segs = [];
    all.forEach((d) => { const t = termOf(state, d), last = segs[segs.length - 1]; if (last && last.term === t) last.nights.push(d); else segs.push({ term: t, nights: [d] }); });
    if (segs.length <= 1) return generateNights(state, all, segs.length ? segs[0].term : null, opts);
    let st = state; const out = { schedule: state.schedule, pending: [], gender: {}, balanced: true };
    segs.forEach((sg) => {
      const r = generateNights(st, sg.nights, sg.term, opts);
      st = Object.assign({}, st, { schedule: r.schedule });
      out.schedule = r.schedule; out.pending = out.pending.concat(r.pending); Object.assign(out.gender, r.gender); out.balanced = out.balanced && r.balanced;
    });
    return out;
  }

  // จัดคืนเวรชุดหนึ่ง (ในเทอมเดียวกัน) ยอดสะสมนับจากคืนเวรแรกของเทอม term ถึงก่อนคืนแรกของชุดนี้
  function generateNights(state, nights, term, opts) {
    opts = opts || {};
    const sched = Object.assign({}, state.schedule);
    const keep = (d) => state.locked[d] || (state.single || {})[d]; // คืนที่ล็อก และเวรเดี่ยว ตัวสร้างไม่แตะ
    nights.forEach((d) => { if (!keep(d)) delete sched[d]; });
    const tmp = Object.assign({}, state, { schedule: sched });
    const gender = planGenders(tmp, nights);
    const free = nights.filter((d) => !keep(d) && !(sched[d] && sched[d].length));
    const pool = {}, pending = [], work = [];
    free.forEach((d) => {
      const all = eligible(tmp, d, gender[d]), rested = all.filter((n) => !onTravel(state, n, d));
      pool[d] = rested.length >= 2 ? rested : all;   // คืนกลับจากราชการ: เลี่ยงก่อน ถ้าเลี่ยงไม่ได้จัดได้ (ตัวตรวจเตือน R)
      if (pool[d].length < 2) pending.push(d); else work.push(d);
    });

    const rng = mulberry32((opts.seed || 1) * 7919 + 13);
    const pairsOf = {};
    work.forEach((d) => {
      const p = pool[d], list = [];
      for (let i = 0; i < p.length; i++) for (let j = i + 1; j < p.length; j++) list.push([p[i], p[j]]);
      if (opts.seed) list.sort(() => rng() - 0.5);
      pairsOf[d] = list;
    });

    // ความสมดุล: นับสะสมตั้งแต่ต้นเทอม (เดือนก่อนๆ ในเทอมเดียวกัน) ถ้าไม่มีเทอมนับภายในเดือน · เวรวันหยุดนับแยก
    const names = state.staff.map((s) => s.name);
    const cnt = {}, hol = {}; names.forEach((n) => { cnt[n] = 0; hol[n] = 0; });
    const prior = term && nights.length ? range(term.from, addDays(nights[0], -1)).filter((d) => isDutyNight(state, d)) : [];
    const tally = (d, list) => (list || []).forEach((n) => { if (n in cnt) { cnt[n]++; if (isHolidayNight(state, d)) hol[n]++; } });
    prior.forEach((d) => tally(d, state.schedule[d]));
    nights.forEach((d) => { if (sched[d] && sched[d].length && !free.includes(d)) tally(d, sched[d]); });
    const act = activeStaff(state), size = { M: act.filter((s) => s.gender === 'M').length, F: act.filter((s) => s.gender === 'F').length };
    const slots = { M: 0, F: 0 }, holSlots = { M: 0, F: 0 };
    nights.forEach((d) => { if (!pending.includes(d) && (free.includes(d) || (sched[d] || []).length)) { slots[gender[d]] += 2; if (isHolidayNight(state, d)) holSlots[gender[d]] += 2; } });
    // ยอดรวมทั้งเทอมของแต่ละชุด (เฉพาะครูที่ยังอยู่เวร) ใช้หาค่าเฉลี่ยต่อคน
    const total = { M: slots.M, F: slots.F }, holTotal = { M: holSlots.M, F: holSlots.F };
    act.forEach((s) => { total[s.gender] += cnt[s.name] - nights.filter((d) => !free.includes(d) && (sched[d] || []).includes(s.name)).length;
      holTotal[s.gender] += hol[s.name] - nights.filter((d) => !free.includes(d) && isHolidayNight(state, d) && (sched[d] || []).includes(s.name)).length; });
    const remain = work.map((d, i) => ({ M: work.slice(i).filter((x) => gender[x] === 'M').length, F: work.slice(i).filter((x) => gender[x] === 'F').length }));
    remain.push({ M: 0, F: 0 });
    const remainHol = work.map((d, i) => ({ M: work.slice(i).filter((x) => gender[x] === 'M' && isHolidayNight(state, x)).length, F: work.slice(i).filter((x) => gender[x] === 'F' && isHolidayNight(state, x)).length }));
    remainHol.push({ M: 0, F: 0 });

    const lastGap = (cur, n, d) => { for (let k = 1; k <= 12; k++) if ((cur[addDays(d, -k)] || []).includes(n)) return k; return 13; };
    const key = (cur, a, b, d) => {
      const neighbor = [-1, 1].some((k) => (cur[addDays(d, k)] || []).some((x) => x === a || x === b)) ? 1000 : 0;
      const holiday = isHolidayNight(state, d) ? (hol[a] + hol[b]) * 100 : 0; // คืนวันหยุด: ให้คนที่มีเวรวันหยุดน้อยก่อน
      return holiday + (cnt[a] + cnt[b]) * 10 + neighbor - Math.min(lastGap(cur, a, d), lastGap(cur, b, d));
    };

    function solve(tol, tolH, budget) {
      const cur = Object.assign({}, sched);
      const cap = {}, floor = {}, holCap = {};
      ['M', 'F'].forEach((g) => { cap[g] = Math.ceil(total[g] / size[g]) + tol; floor[g] = Math.max(0, Math.floor(total[g] / size[g]) - tol); holCap[g] = Math.ceil(holTotal[g] / size[g]) + tolH; });
      let nodes = 0, aborted = false;
      const base = Object.assign({}, cnt), baseHol = Object.assign({}, hol);
      function rec(i) {
        if (aborted) return false;
        for (const s of act) if (floor[s.gender] - cnt[s.name] > remain[i][s.gender]) return false;
        // ตัดทางที่เป็นไปไม่ได้: ที่ว่างรวมของครูแต่ละชุด ต้องพอสำหรับคืนที่เหลือ (ทั้งเวรรวมและเวรวันหยุด)
        for (const g of ['M', 'F']) {
          let room = 0, roomH = 0;
          for (const s of act) if (s.gender === g) { room += Math.max(0, cap[g] - cnt[s.name]); roomH += Math.max(0, holCap[g] - hol[s.name]); }
          if (room < 2 * remain[i][g] || roomH < 2 * remainHol[i][g]) return false;
        }
        if (i === work.length) return true;
        if (++nodes > budget) { aborted = true; return false; }
        const d = work[i], g = gender[d], h = isHolidayNight(state, d) ? 1 : 0;
        const order = pairsOf[d].filter(([a, b]) => cnt[a] < cap[g] && cnt[b] < cap[g] && (!h || (hol[a] < holCap[g] && hol[b] < holCap[g])))
          .map((p) => ({ p, k: key(cur, p[0], p[1], d) })).sort((x, y) => x.k - y.k);
        for (const { p } of order) {
          cur[d] = p; cnt[p[0]]++; cnt[p[1]]++; hol[p[0]] += h; hol[p[1]] += h;
          if (rec(i + 1)) return true;
          cnt[p[0]]--; cnt[p[1]]--; hol[p[0]] -= h; hol[p[1]] -= h; delete cur[d];
        }
        return false;
      }
      const ok = rec(0);
      if (!ok) names.forEach((n) => { cnt[n] = base[n]; hol[n] = baseHol[n]; });
      return ok ? cur : null;
    }

    let result = null, tolUsed = null;
    if (work.length) {
      // ผ่อนความสมดุลเวรวันหยุดก่อน แล้วค่อยผ่อนจำนวนเวรรวม (จำนวนเวรรวมสำคัญกว่า ตามที่หัวหน้าหอกำหนด)
      // [ผ่อนเวรรวม, ผ่อนเวรวันหยุด, งบการค้นหา] รอบที่เข้มที่สุดมักหาไม่ได้ จึงให้งบน้อย เพื่อไม่ให้ช้า
      const steps = [[0, 0, 8000], [0, 1, 60000], [1, 1, 60000], [1, 2, 60000], [2, 2, 60000], [3, 3, 60000], [3, 99, 60000]];
      for (const [tol, tolH, budget] of steps) { result = solve(tol, tolH, budget); tolUsed = tol; if (result) break; }
      if (!result) {
        // สำรอง: เลือกคู่ที่เหมาะที่สุดทีละคืน ไม่บังคับความสมดุล
        tolUsed = null; result = Object.assign({}, sched);
        work.forEach((d) => {
          const h = isHolidayNight(state, d) ? 1 : 0;
          const best = pairsOf[d].map((p) => ({ p, k: key(result, p[0], p[1], d) })).sort((x, y) => x.k - y.k)[0];
          result[d] = best.p; cnt[best.p[0]]++; cnt[best.p[1]]++; hol[best.p[0]] += h; hol[best.p[1]] += h;
        });
      }
    } else result = sched;
    return { schedule: result, pending, gender, balanced: tolUsed === 0 || tolUsed === 1 };
  }

  // ---------- คำเตือนช่วงเสี่ยง (ใช้ตอนกรอกวันไม่ว่าง) ----------
  function capacityWarnings(state, ym) {
    const { start, end } = monthRange(ym);
    const nights = range(start, end).filter((d) => isDutyNight(state, d));
    const gender = planGenders(state, nights);
    const out = [];
    nights.forEach((d) => {
      const g = gender[d];
      const now = eligible(state, d, g, true), base = eligible(state, d, g, false);
      const lost = base.filter((n) => !now.includes(n));
      if (!lost.length) return;
      if (now.length < 2) out.push({ date: d, level: 'error', gender: g, eligible: now, lost, msg: 'ชุด' + GENDER_LABEL[g] + 'เหลือ ' + now.length + ' คน จัดเวรคืนนี้ไม่ได้ (ไม่ว่าง: ' + lost.map((n) => 'ครู' + n).join(', ') + ') หัวหน้าหอต้องพิจารณา' });
      else if (now.length === 2 && base.length > 2) out.push({ date: d, level: 'warn', gender: g, eligible: now, lost, msg: 'ชุด' + GENDER_LABEL[g] + 'เหลือคู่เดียว (' + now.map((n) => 'ครู' + n).join('/') + ') เพราะ ' + lost.map((n) => 'ครู' + n).join(', ') + ' ไม่ว่าง' });
    });
    return out;
  }

  function explainNight(state, d) {
    const g = planGenders(state, [d])[d];
    return { gender: g, eligible: eligible(state, d, g),
      excluded: activeStaff(state).filter((s) => s.gender === g).map((s) => ({ name: s.name, reason: excludedReason(state, s.name, d) })).filter((x) => x.reason) };
  }

  // ---------- สลับครู ----------
  function swapTeachers(state, a, b) {
    if (a.date === b.date) return { ok: false, error: 'ต้องเลือกคนละคืน' };
    const sa = (state.schedule[a.date] || []).slice(), sb = (state.schedule[b.date] || []).slice();
    const ia = sa.indexOf(a.name), ib = sb.indexOf(b.name);
    if (ia < 0 || ib < 0) return { ok: false, error: 'ไม่พบครูในคืนที่เลือก' };
    if (sb.includes(a.name) || sa.includes(b.name)) return { ok: false, error: 'ครูคนนั้นอยู่เวรคืนนั้นอยู่แล้ว' };
    sa[ia] = b.name; sb[ib] = a.name;
    return { ok: true, schedule: Object.assign({}, state.schedule, { [a.date]: sa, [b.date]: sb }) };
  }


  // ---------- รายชื่อครู ----------
  // เปลี่ยนชื่อเล่น: แก้ทุกที่ที่อ้างถึง (ตาราง วันไม่ว่าง กลุ่มกลางวัน) คืน state ใหม่ ไม่แก้ต้นฉบับ
  function renameStaff(state, from, to) {
    to = String(to || '').trim();
    if (!to) return { ok: false, error: 'ชื่อเล่นว่างไม่ได้' };
    if (to === from) return { ok: true, state };
    if (state.staff.some((s) => s.name === to)) return { ok: false, error: 'มีครูชื่อ "' + to + '" อยู่แล้ว' };
    if (!state.staff.some((s) => s.name === from)) return { ok: false, error: 'ไม่พบครูชื่อ "' + from + '"' };
    const st = JSON.parse(JSON.stringify(state));
    st.staff.forEach((s) => { if (s.name === from) s.name = to; });
    Object.keys(st.schedule).forEach((d) => { st.schedule[d] = st.schedule[d].map((n) => (n === from ? to : n)); });
    if (st.unavailable[from]) { st.unavailable[to] = st.unavailable[from]; delete st.unavailable[from]; }
    if (from in st.dayGroups.of) { st.dayGroups.of[to] = st.dayGroups.of[from]; delete st.dayGroups.of[from]; }
    const swap = (ns) => (ns || []).map((n) => (n === from ? to : n));
    Object.values(st.months || {}).forEach((m) => {   // ตารางที่ประกาศ และบันทึกการเปลี่ยนเวร ใช้ชื่อใหม่ด้วย
      if (m.announced) Object.keys(m.announced).forEach((d) => { m.announced[d] = swap(m.announced[d]); });
      (m.changes || []).forEach((c) => { c.from = swap(c.from); c.to = swap(c.to); });
    });
    return { ok: true, state: st };
  }
  // สรุปความเป็นธรรม: เดือนนี้ และสะสมตั้งแต่ต้นเทอมถึงสิ้นเดือนนี้ (ไม่มีเทอม = เฉพาะเดือน) นับจากตารางจริง (เวรเดี่ยวนับ 1 คืน)
  // ถ้าเดือนนั้นมีหลายเทอม ยอดสะสมใช้เทอมของคืนเวรสุดท้ายของเดือน (เทอมล่าสุด) ส่วนคอลัมน์ "เดือนนี้" นับทุกคืนในเดือน
  function fairness(state, ym) {
    const { start, end } = monthRange(ym), monthNights = range(start, end).filter((d) => isDutyNight(state, d));
    const term = monthNights.length ? termOf(state, monthNights[monthNights.length - 1]) : termOfMonth(state, ym);
    const from = term ? term.from : start, to = term && term.to < end ? term.to : end;
    const rows = {}; state.staff.forEach((s) => { rows[s.name] = { name: s.name, gender: s.gender, active: s.active !== false, month: 0, monthHol: 0, cum: 0, cumHol: 0, travel: 0 }; });
    range(from < start ? from : start, end).filter((d) => isDutyNight(state, d)).forEach((d) => {
      const h = isHolidayNight(state, d), inMonth = d >= start, inCum = d >= from && d <= to;
      (state.schedule[d] || []).forEach((n) => { const r = rows[n]; if (!r) return; if (inCum) { r.cum++; if (h) r.cumHol++; } if (inMonth) { r.month++; if (h) r.monthHol++; if (onTravel(state, n, d)) r.travel++; } });
    });
    const list = state.staff.map((s) => rows[s.name]).filter((r) => r.active || r.cum);
    const spread = (g, k) => { const v = list.filter((r) => r.gender === g && r.active).map((r) => r[k]); return v.length ? Math.max(...v) - Math.min(...v) : 0; };
    return { ym, term: term ? term.name || (term.from + ' – ' + term.to) : null, from, to, rows: list,
      spread: { M: { cum: spread('M', 'cum'), cumHol: spread('M', 'cumHol') }, F: { cum: spread('F', 'cum'), cumHol: spread('F', 'cumHol') } } };
  }

  // ข้อความตารางเวรสำหรับส่ง LINE (ข้อความล้วน วางในกลุ่มได้ทันที) opts.fair = แนบสรุปความเป็นธรรม
  function lineMessage(state, ym, opts) {
    opts = opts || {};
    const { start, end } = monthRange(ym), [y, m] = ym.split('-').map(Number);
    const SD = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
    const out = ['📅 ตารางเวรหอนอน ' + (state.dormName || ''), 'ประจำเดือน' + THAI_MONTH[m - 1] + ' ' + (y + 543) + ' · เวร 18:00–07:00 น.', ''];
    range(start, end).forEach((d) => {
      if (!isDutyNight(state, d)) return;
      const ns = state.schedule[d] || [];
      const tags = [holidayName(state, d) ? 'หยุด' : '', isSingle(state, d) ? 'เดี่ยว' : ''].filter(Boolean);
      out.push(SD[dow(d)] + ' ' + Number(d.slice(8)) + ' · ' + (ns.length ? ns.map((n) => 'ครู' + n).join(' / ') : 'รอหัวหน้าหอ') + (tags.length ? ' (' + tags.join(', ') + ')' : ''));
      if (dow(d) === 6) out.push('');
    });
    if (opts.fair) {
      const f = fairness(state, ym);
      out.push('', '📒 สมุดสะสมเวร' + (f.term ? ' (ทั้งเทอม ' + f.term + ')' : ''));
      f.rows.forEach((r) => out.push('ครู' + r.name + ' เดือนนี้ ' + r.month + ' คืน (วันหยุด ' + r.monthHol + ')' + (f.term ? ' · สะสม ' + r.cum + ' (วันหยุด ' + r.cumHol + ')' : '')));
      out.push('คืนวันหยุด = คืนเสาร์ อาทิตย์ และนักขัตฤกษ์');
    }
    out.push('', 'แลกเวรหรือมีธุระ แจ้งหัวหน้าหอ เพื่อบันทึกและคิดค่าตอบแทนตามจริง');
    return out.join('\n').replace(/\n{3,}/g, '\n\n').trim();
  }

  // คืนที่ตารางเปลี่ยน (เทียบก่อน-หลัง) ใช้บันทึกการเปลี่ยนเวรหลังประกาศ: [{date, from, to}] เรียงตามวันที่
  function scheduleDiff(before, after, dates) {
    const keys = dates || Array.from(new Set(Object.keys(before || {}).concat(Object.keys(after || {})))).sort();
    return keys.map((d) => ({ date: d, from: ((before || {})[d] || []).slice(), to: ((after || {})[d] || []).slice() }))
      .filter((x) => x.from.join('|') !== x.to.join('|'));
  }

  // จำนวนคืนในตาราง (ทุกเดือน) ที่มีครูคนนี้ ใช้ตัดสินว่าลบได้ไหม (มีประวัติ = ลบไม่ได้ ให้ตั้งเป็น "ย้ายออก")
  const staffUsage = (state, name) => Object.keys(state.schedule).filter((d) => (state.schedule[d] || []).includes(name)).length;
  // ชื่อที่ใช้ในเอกสาร: คำนำหน้า + ชื่อ-สกุลจริง ถ้ายังไม่กรอกใช้ "ครู" + ชื่อเล่น
  const formalName = (s) => (s && s.fullName ? (s.prefix || '') + s.fullName : s ? 'ครู' + s.name : '');

  // จำนวนเงินเป็นตัวอักษรไทย (แบบ BAHTTEXT) เช่น 7000 → เจ็ดพันบาทถ้วน
  function bahtText(amount) {
    const DIG = ['ศูนย์', 'หนึ่ง', 'สอง', 'สาม', 'สี่', 'ห้า', 'หก', 'เจ็ด', 'แปด', 'เก้า'], POS = ['', 'สิบ', 'ร้อย', 'พัน', 'หมื่น', 'แสน'];
    function read(n, higher) { // n < 1,000,000
      const s = String(n); let out = '';
      for (let i = 0; i < s.length; i++) {
        const d = Number(s[i]), pos = s.length - 1 - i;
        if (!d) continue;
        if (pos === 1) out += d === 1 ? 'สิบ' : d === 2 ? 'ยี่สิบ' : DIG[d] + 'สิบ';
        else if (pos === 0 && d === 1 && (s.length > 1 || higher)) out += 'เอ็ด';
        else out += DIG[d] + POS[pos];
      }
      return out;
    }
    function words(n) {
      if (n === 0) return DIG[0];
      const parts = []; let higher = false;
      while (n > 0) { parts.unshift(n % 1000000); n = Math.floor(n / 1000000); }
      return parts.map((p, i) => { const w = read(p, i > 0 && higher); higher = higher || p > 0; return w + (i < parts.length - 1 ? 'ล้าน' : ''); }).join('');
    }
    if (amount === null || amount === undefined || isNaN(Number(amount))) return '';
    const neg = Number(amount) < 0, cents = Math.round(Math.abs(Number(amount)) * 100);
    const baht = Math.floor(cents / 100), st = cents % 100;
    return (neg ? 'ลบ' : '') + (baht || !st ? words(baht) + 'บาท' : '') + (st ? words(st) + 'สตางค์' : 'ถ้วน');
  }

  // ---------- สำรองข้อมูล / ประวัติเวอร์ชัน (ฟังก์ชันล้วน ทดสอบได้) ----------
  function summarizeState(st) {
    const per = {};
    Object.keys(st.schedule || {}).forEach((d) => { if ((st.schedule[d] || []).length) per[d.slice(0, 7)] = (per[d.slice(0, 7)] || 0) + 1; });
    const months = Object.keys(per).sort().map((ym) => ({ ym, nights: per[ym] }));
    return { months, nights: months.reduce((a, m) => a + m.nights, 0), updatedAt: st.updatedAt || null,
      payrollMonths: Object.keys(st.payroll || {}).sort() };
  }
  // ชื่อไฟล์สำรอง: sod-backup-ปีค.ศ.-เดือน-วัน-ชั่วโมงนาที.json (เวลาท้องถิ่นของเครื่อง)
  // ใช้ตัวอักษร ASCII ล้วน เพราะเบราว์เซอร์บางตัวทำชื่อไฟล์ภาษาไทยหายเป็น "download" (พบใน Chromium)
  function backupFileName(d) {
    return 'sod-backup-' + d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes()) + '.json';
  }
  // เทียบไฟล์สำรองกับข้อมูลบนเครื่อง: older = ไฟล์เก่ากว่า (ระวังทับของใหม่)
  function compareBackup(fileObj, current) {
    const fileTime = (fileObj && (fileObj.updatedAt || fileObj.exportedAt)) || null;
    const curTime = (current && current.updatedAt) || null;
    let relation = 'unknown';
    if (fileTime && curTime) relation = fileTime < curTime ? 'older' : fileTime > curTime ? 'newer' : 'same';
    return { fileTime, curTime, relation };
  }
  function hashString(str) {
    let h = 5381;
    for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
    return String(h >>> 0);
  }
  // ประวัติเวอร์ชัน: เก็บล่าสุด max รายการ (ใหม่สุดอยู่หน้า)
  function pushHistory(list, entry, max) {
    return [entry].concat(list || []).slice(0, max || 10);
  }

  // ---------- ซิงก์กับ GitHub (Contents API) ----------
  // ฟังก์ชันรับ fetch เข้ามาเป็นพารามิเตอร์ เพื่อทดสอบด้วยตัวจำลองได้ ไม่มีโค้ดส่วนไหนอ่านหรือเก็บ token ไว้เอง
  function b64encodeUtf8(str) {
    if (typeof Buffer !== 'undefined') return Buffer.from(str, 'utf8').toString('base64');
    const bytes = new TextEncoder().encode(str);
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin);
  }
  function b64decodeUtf8(b64) {
    const clean = String(b64).replace(/\s/g, '');
    if (typeof Buffer !== 'undefined') return Buffer.from(clean, 'base64').toString('utf8');
    return new TextDecoder().decode(Uint8Array.from(atob(clean), (c) => c.charCodeAt(0)));
  }
  class GhError extends Error {
    constructor(kind, status, message) { super(message); this.kind = kind; this.status = status; }
  }
  function ghValidate(cfg) {
    if (!cfg || !/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(cfg.repo || '')) return 'ชื่อ repo ต้องอยู่ในรูป เจ้าของ/ชื่อ-repo';
    if (!cfg.path || /^\/|\.\.|\/\/|\s/.test(cfg.path)) return 'ที่อยู่ไฟล์ไม่ถูกต้อง (เช่น data/latest.json)';
    if (!cfg.token) return 'ยังไม่ได้ใส่ token';
    return null;
  }
  const ghRepoUrl = (cfg) => 'https://api.github.com/repos/' + cfg.repo;
  const ghFileUrl = (cfg) => ghRepoUrl(cfg) + '/contents/' + cfg.path.split('/').map(encodeURIComponent).join('/');
  function ghHeaders(cfg, json) {
    const h = { Authorization: 'Bearer ' + cfg.token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
    if (json) h['Content-Type'] = 'application/json';
    return h;
  }
  function ghHttpError(status) {
    if (status === 401) return new GhError('auth', status, 'token ไม่ถูกต้องหรือหมดอายุ (สร้างใหม่ที่ GitHub)');
    if (status === 403) return new GhError('forbidden', status, 'ไม่มีสิทธิ์ หรือเรียกถี่เกินโควตาของ GitHub (ลองใหม่ภายหลัง)');
    if (status === 404) return new GhError('notfound', status, 'ไม่พบ repo หรือ token ไม่มีสิทธิ์กับ repo นี้');
    if (status === 409 || status === 422) return new GhError('conflict', status, 'ข้อมูลบน GitHub เปลี่ยนไประหว่างส่ง (ลองใหม่)');
    return new GhError('http', status, 'GitHub ตอบกลับผิดปกติ (รหัส ' + status + ')');
  }
  async function ghFetch(f, url, init) {
    try { return await f(url, init); } catch (e) { throw new GhError('network', 0, 'ติดต่อ GitHub ไม่ได้ (ตรวจอินเทอร์เน็ต)'); }
  }
  // อ่านไฟล์: {status:'ok', sha, text, obj} | {status:'missing'} หรือ throw GhError
  async function ghGet(cfg, f) {
    const bad = ghValidate(cfg);
    if (bad) throw new GhError('config', 0, bad);
    const res = await ghFetch(f, ghFileUrl(cfg), { headers: ghHeaders(cfg), cache: 'no-store' });
    if (res.status === 404) {
      // 404 แปลว่า "ไม่มีไฟล์" หรือ "เข้า repo ไม่ได้" ตรวจ repo เพื่อแยกสองกรณี
      const repo = await ghFetch(f, ghRepoUrl(cfg), { headers: ghHeaders(cfg), cache: 'no-store' });
      if (repo.status === 200) return { status: 'missing' };
      throw ghHttpError(repo.status === 404 ? 404 : repo.status);
    }
    if (res.status !== 200) throw ghHttpError(res.status);
    const json = await res.json();
    if (Array.isArray(json) || json.type === 'dir' || !json.content) throw new GhError('format', 200, 'ที่อยู่ไฟล์นี้ไม่ใช่ไฟล์ข้อมูล (หรือไฟล์ใหญ่เกินไป)');
    const text = b64decodeUtf8(json.content);
    let obj;
    try { obj = JSON.parse(text); } catch (e) { throw new GhError('format', 200, 'ไฟล์บน GitHub ไม่ใช่ข้อมูลของระบบนี้ (อ่านเป็น JSON ไม่ได้)'); }
    return { status: 'ok', sha: json.sha, text, obj };
  }
  // เขียนไฟล์ (สร้างใหม่เมื่อไม่ส่ง sha, อัปเดตเมื่อส่ง sha ของไฟล์เดิม) คืน {sha}
  async function ghPut(cfg, f, text, message, sha) {
    const bad = ghValidate(cfg);
    if (bad) throw new GhError('config', 0, bad);
    const body = { message, content: b64encodeUtf8(text) };
    if (sha) body.sha = sha;
    const res = await ghFetch(f, ghFileUrl(cfg), { method: 'PUT', headers: ghHeaders(cfg, true), body: JSON.stringify(body) });
    if (res.status !== 200 && res.status !== 201) throw ghHttpError(res.status);
    const json = await res.json();
    return { sha: json.content && json.content.sha };
  }

  return { VERSION, SCHEMA, isSupportedVersion, migrate, THAI_DOW, THAI_MONTH, SHORT_MONTH, GENDER_LABEL, GENDER_SHORT,
    parse, fmt, addDays, diffDays, dow, range, isIso, monthOf, monthRange, addMonth,
    defaultState, activeStaff, lineMessage, termOf, termOfMonth, holidayName, isHolidayNight, onTravel, fairness, FIXED_HOLIDAYS, isSingle, nightGender, scheduleDiff, renameStaff, staffUsage, formalName, bahtText, genderOf, pairGender, dayGroup, dayMembers, isDutyNight, excludedReason, eligible,
    validate, monthStats, payroll, planGenders, generate, capacityWarnings, explainNight, swapTeachers,
    summarizeState, backupFileName, compareBackup, hashString, pushHistory,
    b64encodeUtf8, b64decodeUtf8, GhError, ghValidate, ghGet, ghPut };
});
</script>
<script>
(function () {
  'use strict';
  const S = window.SOD;
  const APP_VERSION = '1.5.3'; // ต้องตรงกับ SOD.VERSION ใน core.js (ถ้าไม่ตรง แปลว่าอัปโหลดไฟล์ไม่ครบ)
  const KEY_SAVED = 'sod-v2-saved', KEY_DRAFT = 'sod-v2-draft'; // 'v2' = รูปแบบที่เก็บใน localStorage ไม่ใช่เวอร์ชันข้อมูล

  // ---------- สถานะ: แก้ไขได้ทันที แต่ต้องกด "บันทึก" จึงเป็นฉบับที่บันทึก ----------
  function normalize(obj) {
    const m = S.migrate(obj);
    const base = S.defaultState();
    const st = Object.assign(base, m);

    else if (pendN) slides.push(['warn', 'รอหัวหน้าหอ ' + pendN + ' คืน', 'ยังไม่มีครูเวร แตะวันที่ในปฏิทินเพื่อจัดเอง', btn('ดูรายการ', 'data-action="goto" data-target="issues"')]);
    else slides.push(['ok', 'ผ่านเงื่อนไขพื้นฐานครบ', 'คู่เพศเดียวกัน · สลับชุด · ไม่ชนเวรกลางวัน', btn('พิมพ์ตาราง', 'data-action="print"')]);
    if (S.activeStaff(state).length && !(state.terms || []).length) slides.push(['warn', 'ยังไม่ได้ตั้งเทอม', 'ตั้งเทอมเพื่อให้ระบบเกลี่ยเวรสะสมทั้งเทอม (รวมเวรวันหยุด) ตอนนี้นับเฉพาะในเดือน', btn('ตั้งเทอม', 'data-action="tab" data-tab="settings"')]);
    if (riskN) slides.push(['warn', 'ช่วงเสี่ยง ' + riskN + ' คืน', 'ครูไม่ว่างจนชุดเหลือน้อย ควรดูก่อนสร้างตาราง', btn('ดูช่วงเสี่ยง', 'data-action="goto" data-target="risk"')]);
    if (unbacked()) slides.push(['ok', 'ยังไม่ได้สำรองข้อมูล', meta.lastBackupAt ? 'สำรองล่าสุด ' + dt(meta.lastBackupAt) : 'ยังไม่เคยสำรอง เก็บไฟล์ไว้ใน iCloud Drive', btn('สำรองตอนนี้', 'data-action="export-json"')]);
    return '<div class="feat noprint"><div class="feat-track">' + slides.map(([kind, title, sub, b], i) =>
      '<div class="feat-card feat-' + kind + '"><div class="feat-txt"><span class="feat-brand">🌙 หอฟ้าทะลายโจร</span><strong>' + title + '</strong><span class="feat-sub">' + sub + '</span>' + b + '</div>' + featArt(kind, i) + '</div>').join('') + '</div>' +
      (slides.length > 1 ? '<div class="dots">' + slides.map((x, i) => '<button class="dot-btn" data-action="feat-dot" data-i="' + i + '" aria-label="การ์ดที่ ' + (i + 1) + '"' + (i ? '' : ' aria-current="true"') + '></button>').join('') + '</div>' : '') + '</div>';
  }
  // แถวการ์ดเลื่อนแนวนอน: เวร 7 คืนข้างหน้า (นับจากวันนี้ ไม่ขึ้นกับเดือนที่กำลังดู)
  function weekHtml() {
    const t = localToday(), days = S.range(t, S.addDays(t, 6));
    const genders = S.planGenders(state, days.filter((d) => S.isDutyNight(state, d)));
    const cards = days.map((d) => {
      const top = '<span class="wkc-top"><b>' + Number(d.slice(8)) + '</b><span>' + S.THAI_DOW[S.dow(d)] + '<br>' + S.SHORT_MONTH[Number(d.slice(5, 7)) - 1] + '</span>' + (d === t ? '<em>คืนนี้</em>' : '') + '</span>';
      if (!S.isDutyNight(state, d)) return '<div class="wkc off">' + top + '<span class="wkc-bot"><span class="muted">ไม่มีเวร</span></span></div>';
      const ns = state.schedule[d] || [], g = ns.length ? (S.nightGender(state, d) || genders[d]) : genders[d];
      return '<button class="wkc wkc-' + g + '" data-action="edit" data-date="' + d + '">' + top + '<span class="wkc-bot"><span class="wkc-tags">' + gtag(g) + '<span class="wkc-dg">กลุ่ม ' + dgText(d) + '</span>' + (S.holidayName(state, d) ? '<span class="tagx hol">หยุด</span>' : '') + (S.isSingle(state, d) ? '<span class="tagx">เดี่ยว</span>' : '') + (state.locked[d] ? ' 🔒' : '') + '</span>' +
        (ns.length ? ns.map((n) => '<span class="chip" style="' + chipStyle(n) + '">ครู' + esc(n) + '</span>').join('') : '<span class="pend">รอหัวหน้าหอ</span>') + '</span></button>';
    }).join('');
    return '<div class="noprint"><h2 class="sec">เวร 7 คืนข้างหน้า</h2><div class="wk-track">' + cards + '</div></div>';
  }

  function monthBar() {
    return '<div class="bar noprint"><div class="month"><button class="btn" data-action="month" data-n="-1" aria-label="เดือนก่อน">‹</button><span>' + ymLabel(view.ym) +
      '</span><button class="btn" data-action="month" data-n="1" aria-label="เดือนถัดไป">›</button></div></div>';
  }
  function saveBar() {
    const dirty = isDirty(), stale = unbacked();
    const banner = dirty ? '<div class="banner warn noprint"><strong class="dirty">มีการแก้ไขที่ยังไม่ได้บันทึก</strong>' +
      '<button class="btn primary" data-action="save">บันทึก</button><button class="btn" data-action="discard">ยกเลิกการแก้ไข</button></div>' : '';
    const backup = stale ? '<span class="dirty" title="' + (meta.lastBackupAt ? 'สำรองล่าสุด ' + dt(meta.lastBackupAt) : 'ยังไม่เคยสำรอง') + '">⚠ ยังไม่ได้สำรอง</span><button class="btn sm" data-action="export-json">สำรอง</button>'
      : '<span class="muted">' + (meta.lastBackupAt ? 'สำรอง ' + dtShort(meta.lastBackupAt) : 'ยังไม่เคยสำรอง') + '</span>';
    return banner + '<div class="statusline noprint">' + (dirty ? '' : '<span class="saved" title="' + (state.updatedAt ? 'บันทึกล่าสุด ' + dt(state.updatedAt) : '') + '">✓ บันทึก ' + (state.updatedAt ? dtShort(state.updatedAt) : '') + '</span>') +
      backup + syncLine() + '</div>';
  }

  function issuesByDate(issues) {
    const by = {};
    issues.forEach((i) => {
      if (!i.date) return;
      const b = by[i.date] || (by[i.date] = { level: 'warn', msgs: [] });
      if (i.level === 'error') b.level = 'error';
      b.msgs.push(i.rule + ': ' + i.msg);
    });
    return by;
  }

  function renderSchedule() {
    const { start, end } = monthRange();
    const issues = S.validate(state, start, end);
    const by = issuesByDate(issues);
    const { errN, pendN } = monthCounts(issues);
    const risk = S.capacityWarnings(state, view.ym);
    const nights = S.range(start, end);
    const genders = S.planGenders(state, nights.filter((d) => S.isDutyNight(state, d)));

    const firstDuty = nights.find((d) => S.isDutyNight(state, d));
    let note = '';
    if (firstDuty) {
      const prev = S.addDays(firstDuty, -1);
      if (S.isDutyNight(state, prev) && !(state.schedule[prev] || []).length) note = '<p class="muted noprint" style="margin:0 0 12px">⚠ ยังไม่มีตารางเวรของคืนก่อนหน้า (' + be(prev) + ') คืนแรกของเดือนนี้จึงใช้ชุดตามค่าตั้งต้น ควรจัดเดือนก่อนหน้าก่อน เพื่อให้ต่อรอยต่อเดือนถูกต้อง</p>';
    }

    const SHORT_DOW = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
    let cells = S.THAI_DOW.map((n, i) => '<div class="dow' + (i === 0 || i === 6 ? ' we' : '') + '"><span class="full">' + n + '</span><span class="short">' + SHORT_DOW[i] + '</span></div>').join('');
    for (let i = 0; i < S.dow(start); i++) cells += '<div class="cell blank"></div>';
    nights.forEach((d) => {
      const w = S.dow(d), cls = w === 6 ? ' sat' : w === 0 ? ' sun' : '';
      const head = '<span class="dn"><span class="num">' + Number(d.slice(8)) + '<span class="wk">' + S.THAI_DOW[w] + '</span></span><span class="meta"><span class="dg"><i>กลุ่ม </i>' + dgText(d) + '</span>' + (state.locked[d] ? ' 🔒' : '') + '</span></span>';
      if (!S.isDutyNight(state, d)) { cells += '<div class="cell off' + cls + '">' + head + '<span class="body"><span class="muted">ไม่มีเวร</span></span></div>'; return; }
      const ns = state.schedule[d] || [];
      const g = ns.length ? (S.nightGender(state, d) || genders[d]) : genders[d];
      const b = by[d], changed = (monthInfo(view.ym).changes || []).some((c) => c.date === d);
      const flag = b ? (b.level === 'error' ? ' has-err' : ' has-warn') : '';
      const inner = ns.length ? '<span class="chips">' + ns.map((n) => '<span class="chip" style="' + chipStyle(n) + '">ครู' + esc(n) + '</span>').join('') + '</span>' : '<span class="pend">รอหัวหน้าหอ</span>';
      const hn = S.holidayName(state, d);
      const tags = gtag(g) + (hn ? '<span class="tagx hol" title="' + esc(hn) + '">หยุด</span>' : '') + (S.isSingle(state, d) ? '<span class="tagx">เดี่ยว</span>' : '') + (changed ? '<span class="tagx chg noprint" title="เปลี่ยนหลังประกาศ">แก้</span>' : '');
      const tip = [hn].concat(b ? b.msgs : []).filter(Boolean);
      cells += '<button class="cell' + cls + (hn ? ' hol' : '') + flag + '" data-action="edit" data-date="' + d + '"' + (tip.length ? ' title="' + esc(tip.join('\n')) + '"' : '') + '>' + head + '<span class="body"><span class="tagrow">' + tags + '</span>' + inner + '</span></button>';
    });

    const riskHtml = risk.length ? '<div class="card noprint" id="risk"><h2>ช่วงเสี่ยง (ครูไม่ว่างทำให้ชุดเหลือน้อย)</h2><ul class="issues">' +
      risk.map((r) => '<li class="' + (r.level === 'error' ? 'error' : 'warn') + '" data-action="edit" data-date="' + r.date + '" tabindex="0"><span class="rule">' + (r.level === 'error' ? '✖' : '⚠') + '</span><span><strong>' + be(r.date) + '</strong> · ' + esc(r.msg) + '</span></li>').join('') + '</ul></div>' : '';
    const list = issues.filter((i) => i.level !== 'info');
    const issuesHtml = list.length ? '<div class="card noprint" id="issues"><h2>รายการที่ต้องดู (' + list.length + ')</h2><ul class="issues">' +
      list.map((i) => '<li class="' + i.level + '" data-action="edit" data-date="' + i.date + '" tabindex="0"><span class="rule">' + i.rule + '</span><span><strong>' + be(i.date) + '</strong> · ' + esc(i.msg) + '</span></li>').join('') + '</ul></div>' : '';

    const total = nights.filter((d) => S.isDutyNight(state, d)).length;

    const qa = (action, ic, label, cls) => '<button class="qa' + (cls ? ' ' + cls : '') + '" data-action="' + action + '"><span class="qi">' + icon(ic) + '</span><span>' + label + '</span></button>';
    const mi = monthInfo(view.ym), nChg = (mi.changes || []).length;
    const status = mi.closedAt ? '<div class="mstat noprint closed"><span>🔒 <b>ปิดเดือนแล้ว</b> ' + dt(mi.closedAt) + ' · แก้ตารางไม่ได้</span><button class="btn sm" data-action="tab" data-tab="summary">ดูที่แท็บสรุป</button></div>'
      : mi.announcedAt ? '<div class="mstat noprint on"><span>📣 <b>ประกาศแล้ว</b> ' + dt(mi.announcedAt) + ' · เปลี่ยนหลังประกาศ ' + nChg + ' ครั้ง (ระบบบันทึกให้)</span><button class="btn sm" data-action="tab" data-tab="summary">ดูบันทึก</button></div>'
      : '<div class="mstat noprint"><span>📝 <b>ร่าง</b> · ยังไม่ประกาศ</span><button class="btn sm primary" data-action="announce">ประกาศตาราง</button></div>';
    return '<div class="quick noprint">' + qa('generate', 'sparkle', 'สร้างตาราง', 'qa-main') + qa('swap-open', 'swap', 'สลับครู') + qa('share', 'send', 'ส่ง LINE') + qa('more', 'more', 'เพิ่มเติม') + '</div>' + status +
      '<p class="muted noprint hint-line">แตะที่วันเพื่อแก้ไขหรือล็อกคืน · ตัวสร้างอัตโนมัติจะไม่แตะคืนที่ล็อก และไม่ผ่อนเงื่อนไขเอง คืนที่จัดไม่ได้จะเป็น "รอหัวหน้าหอ"</p>' + note +
      featHtml(total, errN, pendN, risk.length) + weekHtml() + riskHtml +
      '<div class="card"><div class="print-title"><h2>ตารางเวรหอนอน หอฟ้าทะลายโจร · ' + ymLabel(view.ym) + '</h2></div><div class="grid">' + cells + '</div>' +
      '<div class="legend">' + gtag('M') + ' ชุดชาย ' + gtag('F') + ' ชุดหญิง · "กลุ่ม n" = เวรกลางวันของวันนั้น · ' + S.activeStaff(state).map((s) => '<span class="chip" style="display:inline-block;' + chipStyle(s.name) + '">ครู' + esc(s.name) + '</span>').join(' ') + '</div></div>' +
      fairnessCard() + issuesHtml;
  }

  // วันที่ (เลขวัน) ที่ครูขึ้นเวรในเดือนที่กำลังดู
  // สมุดสะสมเวร (เดิมชื่อ สรุปความเป็นธรรม): แสดงที่แท็บสรุป และพิมพ์ติดไปกับตารางเวร
  function fairnessCard() {
    const f = S.fairness(state, view.ym);
    if (!f.rows.length) return '';
    const anyTravel = f.rows.some((r) => r.travel);
    const rows = f.rows.map((r) => '<tr><td><span class="chip" style="display:inline-block;' + chipStyle(r.name) + '">ครู' + esc(r.name) + '</span> ' + gtag(r.gender) + '</td>' +
      '<td class="num">' + r.month + '</td><td class="num">' + r.monthHol + '</td><td class="num"><b>' + r.cum + '</b></td><td class="num"><b>' + r.cumHol + '</b></td>' +
      (anyTravel ? '<td class="num">' + (r.travel || '–') + '</td>' : '') + '</tr>').join('');
    const sp = (g) => S.GENDER_LABEL[g] + ': เวรรวมต่างกัน ' + f.spread[g].cum + ' · เวรวันหยุดต่างกัน ' + f.spread[g].cumHol;
    return '<div class="card fair"><h2>สมุดสะสมเวร' + (f.term ? ' · เทอม ' + esc(f.term) : '') + '</h2>' +
      '<p class="muted">' + (f.term ? 'สะสมตั้งแต่ ' + be(f.from) + ' ถึง ' + be(f.to) : 'ยังไม่ได้ตั้งเทอม จึงนับเฉพาะเดือน' + ymLabel(view.ym)) + ' · นับจากตารางจริง (หลังเปลี่ยนเวร) · คืนวันหยุด = คืนวันเสาร์ คืนวันอาทิตย์ และคืนวันหยุดนักขัตฤกษ์</p>' +
      '<div class="tablewrap"><table><thead><tr><th>ครู</th><th class="num">เดือนนี้</th><th class="num">วันหยุด (เดือนนี้)</th><th class="num">สะสม' + (f.term ? 'ทั้งเทอม' : '') + '</th><th class="num">วันหยุดสะสม</th>' +
      (anyTravel ? '<th class="num">จัดในคืนกลับราชการ</th>' : '') + '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
      // การ์ด (ใช้ตอนพิมพ์ใต้ปฏิทิน): ครูละใบ เดือนนี้ / สะสมทั้งเทอม
      '<div class="fair-cards">' + f.rows.map((r) => '<div class="fcard"><span class="chip" style="' + chipStyle(r.name) + '">ครู' + esc(r.name) + '</span>' +
        '<span class="fl"><b>เดือนนี้ ' + r.month + ' คืน</b> (หยุด ' + r.monthHol + ')</span>' + (f.term ? '<span class="fl muted">สะสม ' + r.cum + ' คืน (หยุด ' + r.cumHol + ')</span>' : '') +
        (r.travel ? '<span class="fl">จัดในคืนกลับราชการ ' + r.travel + ' คืน</span>' : '') + '</div>').join('') + '</div>' +
      '<p class="muted" style="margin-bottom:0">ส่วนต่างสูงสุดระหว่างครูชุดเดียวกัน (สะสม) · ' + sp('M') + ' · ' + sp('F') + ' · ตัวสร้างตารางเกลี่ยจำนวนเวรสะสมก่อน แล้วจึงเวรวันหยุด</p></div>';
  }

  const dutyDates = (n, markSingle) => { const { start, end } = monthRange(); return S.range(start, end).filter((d) => S.isDutyNight(state, d) && (state.schedule[d] || []).includes(n)).map((d) => Number(d.slice(8)) + (markSingle && S.isSingle(state, d) ? ' (เดี่ยว)' : '')); };
  const staffOf = (n) => state.staff.find((s) => s.name === n);
  const PREFIXES = ['', 'นาย', 'นาง', 'นางสาว'];
  const prefixOptions = (sel) => PREFIXES.map((x) => '<option value="' + x + '"' + ((sel || '') === x ? ' selected' : '') + '>' + (x || '–') + '</option>').join('');

  function renderSummary() {
    const p = S.payroll(state, view.ym);
    const anySingle = p.rows.some((r) => r.singles);
    const rows = p.rows.map((r) => '<tr><td><span class="chip" style="display:inline-block;' + chipStyle(r.name) + '">ครู' + esc(r.name) + '</span> ' + gtag(r.gender) + '</td>' +
      '<td class="num"><strong>' + r.count + '</strong></td>' + (anySingle ? '<td class="num">' + (r.singles || '–') + '</td>' : '') + '<td class="muted">' + (dutyDates(r.name).join(', ') || '–') + '</td><td class="num">' + money(r.pay) + '</td></tr>').join('');
    const totalCount = p.rows.reduce((a, r) => a + r.count, 0);
    return '<div class="card"><h2>ค่าตอบแทนเดือน' + ymLabel(view.ym) + '</h2>' +
      '<div class="row"><label class="f">ยอดจากการเงิน (บาท)<input type="number" step="0.01" min="0" inputmode="decimal" data-payroll="' + view.ym + '" value="' + (state.payroll[view.ym] ?? '') + '" placeholder="เช่น 7000"></label></div>' +
      '<div class="kpis"><div><span>คืนที่มีเวรในเดือน</span><b class="big">' + p.nights + '</b></div>' +
      '<div><span>ต่อ 1 คืน (N = ยอด ÷ จำนวนคืน)</span><b class="big">' + money(p.N) + '</b></div>' +
      '<div><span>ต่อครู 1 คน 1 คืน (X = N ÷ 2)</span><b class="big">' + money(p.X) + '</b></div></div>' +
      (p.pending.length ? '<div class="banner warn"><strong>ยังมี ' + p.pending.length + ' คืนที่ไม่ครบ 2 คน</strong><span class="muted">ยอดรวมที่จ่ายจะน้อยกว่ายอดการเงิน ตรวจที่แท็บตารางเวร</span></div>' : '') +
      '<div class="tablewrap"><table><thead><tr><th>ครู</th><th class="num">จำนวนเวร</th>' + (anySingle ? '<th class="num">เวรเดี่ยว (×2)</th>' : '') + '<th>วันที่ขึ้นเวร</th><th class="num">ค่าตอบแทน (บาท)</th></tr></thead><tbody>' + rows + '</tbody>' +
      '<tfoot><tr><td>รวม</td><td class="num">' + totalCount + '</td>' + (anySingle ? '<td></td>' : '') + '<td></td><td class="num">' + money(p.total) + '</td></tr></tfoot></table></div>' +
      '<p class="muted">ค่าตอบแทน = X × จำนวนส่วนของครู (เวรปกติ 1 ส่วน เวรเดี่ยว 2 ส่วน) · ไม่ปัดเศษระหว่างคำนวณ แสดงเป็นสตางค์ (ผลรวมที่แสดงรายคนอาจต่างจากยอดรวม ±0.01) · นับเวรตามวันที่เริ่มเวร 18:00 · นับตามครูที่ขึ้นเวรจริงในตารางปัจจุบัน</p>' +
      '<div class="row noprint"><button class="btn" data-action="export-pay">ส่งออก CSV</button><button class="btn" data-action="print">พิมพ์ / PDF</button></div></div>' +
      fairnessCard() + monthCard() + receiptCard(p) + receiptDoc(p);
  }

  // สถานะเดือน + บันทึกการเปลี่ยนเวรหลังประกาศ + ปิดเดือน
  const pairText = (ns) => (ns.length ? ns.map((n) => 'ครู' + n).join(' / ') : '(ว่าง)');
  const changeRows = (list) => list.map((c) => '<tr><td>' + be(c.date) + '</td><td>' + esc(pairText(c.from)) + '</td><td>' + esc(pairText(c.to)) + '</td><td>' + esc(c.reason || '') + '</td><td class="muted">' + dt(c.at) + '</td></tr>').join('');
  function monthCard() {
    const mi = monthInfo(view.ym), list = mi.changes || [];
    const head = mi.closedAt ? '<span class="badge b-ok">ปิดเดือนแล้ว ' + dt(mi.closedAt) + '</span>' : mi.announcedAt ? '<span class="badge b-warn">ประกาศแล้ว ' + dt(mi.announcedAt) + '</span>' : '<span class="badge b-na">ร่าง ยังไม่ประกาศ</span>';
    return '<div class="card noprint"><h2>สถานะเดือน ' + head + '</h2>' +
